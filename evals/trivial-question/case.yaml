schema_version: "1.1"
name: trivial-question
description: >
  Should not change anything: a one-line question about the code. The
  playbook's rule 1 says to just answer, with no workflow, plan or subagent.
tags: [should-not-fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    What does slugify in app/text.py return for "Hello, World!"? Just the answer, please.
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Bash, Skill, Agent]
runs: 3
graders:
  - type: regex
    name: correct-answer
    pattern: hello-world
  - type: tool_used
    name: no-subagent
    tool: Agent
    min: 0
    max: 0
    arm: both
  - type: llm
    name: no-ceremony
    criteria: >
      The answer gives the result (hello-world) in at most three sentences. It
      contains no plan, no workflow name (factory, fanout, oneshot, triage), no
      status title and no "Decisions" or "Follow-ups" section.
